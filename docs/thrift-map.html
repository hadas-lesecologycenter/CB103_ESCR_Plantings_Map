<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SECONDHAND ★ LES + EAST VILLAGE</title>
<meta name="description" content="Interactive map of vintage, thrift, consignment and secondhand shops in the Lower East Side and East Village, with walking routes."/>
<link rel="stylesheet" href="vendor/leaflet.css"/>
<style>
/* ══════════════════════════════════════════════════════════════════════
   Y2K / early-web styling. Fonts are system fonts on purpose — period
   correct, and nothing to download that could fail.
   ══════════════════════════════════════════════════════════════════════ */
:root{
  --pink:#FF2E97; --cyan:#00B8FF; --lime:#C6FF3D; --violet:#A45DEB;
  --orange:#FF9F1C; --green:#00D68F; --yellow:#FFE23D; --red:#FF4757;
  --ink:#14082A; --deep:#1E0C3D; --white:#fff;
  --chrome:linear-gradient(180deg,#fff 0%,#e8eefb 45%,#b9c8e4 52%,#e9f0ff 100%);
  --shadow:3px 3px 0 rgba(20,8,42,.85);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;font-family:Verdana,Geneva,Tahoma,sans-serif;color:var(--ink);background:var(--deep)}
body{overflow:hidden}

/* ── layout: a grid, so panels can never sit on top of the map ───────── */
#app{display:grid;grid-template-columns:342px 1fr;height:100%;width:100%}
#side{
  background:
    repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 2px,transparent 2px 9px),
    linear-gradient(165deg,#FFD9F2 0%,#D9E4FF 40%,#CFF7FF 75%,#EDFFD6 100%);
  border-right:3px solid var(--ink);overflow-y:auto;overflow-x:hidden;padding:14px 14px 22px;
}
#mapwrap{position:relative;min-width:0;min-height:0}
#map{position:absolute;inset:0;background:#241046}

/* ── chrome scrollbar ─────────────────────────────────────────────────── */
#side::-webkit-scrollbar{width:13px}
#side::-webkit-scrollbar-track{background:#e7d9ff;border-left:2px solid var(--ink)}
#side::-webkit-scrollbar-thumb{background:var(--chrome);border:2px solid var(--ink);border-radius:7px}

/* ── header ──────────────────────────────────────────────────────────── */
#hdr{background:linear-gradient(180deg,#2B1259 0%,#4B1D8F 48%,#2B1259 100%);
  border:3px solid var(--ink);border-radius:13px;padding:11px 12px 12px;box-shadow:var(--shadow);margin-bottom:12px}
#hdr h1{margin:0;font-family:'Arial Black','Arial Bold',Impact,sans-serif;font-size:19px;line-height:1.06;
  letter-spacing:-.02em;text-transform:uppercase;
  background:linear-gradient(180deg,#fff 0%,#ffe6fa 38%,var(--pink) 55%,#ff8ed0 74%,#fff 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(1.5px 1.5px 0 #12061f)}
#hdr p{margin:6px 0 0;font-size:10px;color:#E9DBFF;line-height:1.5}
#hdr .spark{color:var(--lime)}

/* ── blocks ──────────────────────────────────────────────────────────── */
.blk{background:rgba(255,255,255,.94);border:3px solid var(--ink);border-radius:13px;
  padding:11px 12px 12px;box-shadow:var(--shadow);margin-bottom:11px}
.lbl{font-family:'Arial Black',Arial,sans-serif;font-size:10px;letter-spacing:.03em;text-transform:uppercase;
  color:var(--ink);margin:0 0 7px;display:flex;align-items:center;gap:5px}
.lbl b{color:var(--pink)}
.chips+.lbl,.seg+.lbl,.tgl+.lbl,.lbl+.lbl{margin-top:14px}

/* ── controls ────────────────────────────────────────────────────────── */
#search{width:100%;border:2.5px solid var(--ink);border-radius:20px;padding:8px 12px;
  font:400 12px Verdana,sans-serif;background:#fff;box-shadow:inset 2px 2px 0 rgba(20,8,42,.13)}
#search:focus{outline:none;border-color:var(--pink);background:#fff8fd}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:2px solid var(--ink);border-radius:20px;padding:4px 10px;font:700 10px Verdana,sans-serif;
  color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:5px;
  background:linear-gradient(180deg,#fff 0%,#f2f5ff 48%,#dde6f8 52%,#fff 100%);
  box-shadow:1.5px 1.5px 0 rgba(20,8,42,.6);transition:transform .08s}
.chip:hover{transform:translate(-1px,-1px);box-shadow:2.5px 2.5px 0 rgba(20,8,42,.7)}
.chip:active{transform:translate(1px,1px);box-shadow:0 0 0 rgba(20,8,42,.6)}
.chip.on{background:linear-gradient(180deg,#fff9fd 0%,var(--pink) 30%,#e01b7f 100%);color:#fff;
  text-shadow:1px 1px 0 rgba(0,0,0,.35)}
.chip i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink);flex:none}
.seg{display:flex;gap:4px}
.seg button{flex:1;border:2px solid var(--ink);border-radius:8px;padding:6px 2px;cursor:pointer;
  font:700 11px Verdana,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,#fff 0%,#f2f5ff 48%,#dde6f8 52%,#fff 100%);box-shadow:1.5px 1.5px 0 rgba(20,8,42,.6)}
.seg button.on{background:linear-gradient(180deg,#f0fbff 0%,var(--cyan) 32%,#0087c9 100%);color:#fff;
  text-shadow:1px 1px 0 rgba(0,0,0,.3)}
.tgl{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;margin-top:8px;cursor:pointer;line-height:1.3}
.tgl input{accent-color:var(--pink);width:15px;height:15px;margin:0;flex:none}

/* ── route buttons ───────────────────────────────────────────────────── */
.routebtn{width:100%;text-align:left;border:2.5px solid var(--ink);border-radius:11px;padding:8px 10px;
  margin-top:6px;cursor:pointer;display:flex;align-items:center;gap:8px;font-family:Verdana,sans-serif;
  background:linear-gradient(180deg,#fff 0%,#f4f7ff 48%,#e2e9fa 52%,#fff 100%);box-shadow:2px 2px 0 rgba(20,8,42,.6)}
.routebtn b{font-family:'Arial Black',Arial,sans-serif;font-size:11px;display:block;line-height:1.25}
.routebtn small{font-size:9.5px;color:#5b4a72;font-weight:700}
.routebtn .dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--ink);flex:none}
.routebtn.on{background:linear-gradient(180deg,#fffdf0 0%,var(--yellow) 34%,#e8c800 100%)}

/* ── route detail (inside the sidebar — never floats over the map) ───── */
#rc{display:none;background:linear-gradient(180deg,#2B1259,#43197F);color:#fff;border:3px solid var(--ink);
  border-radius:13px;padding:11px 12px;box-shadow:var(--shadow);margin-bottom:11px}
#rc h2{margin:0 0 4px;font-family:'Arial Black',Arial,sans-serif;font-size:13px;color:var(--lime)}
#rc p{margin:0 0 8px;font-size:10px;line-height:1.55;color:#E9DBFF}
#rc ol{margin:0;padding-left:21px;font-size:11px;line-height:1.75}
#rc li{cursor:pointer}
#rc li:hover{color:var(--lime);text-decoration:underline}

/* ── counter + actions ───────────────────────────────────────────────── */
#count{font-size:11px;font-weight:700;text-align:center;line-height:1.5}
#count b{font-family:'Arial Black',Arial,sans-serif;color:var(--pink);font-size:14px}
.btn{display:block;width:100%;border:2.5px solid var(--ink);border-radius:22px;padding:9px 8px;margin-top:8px;
  cursor:pointer;text-align:center;text-decoration:none;font:700 11px Verdana,sans-serif;color:var(--ink);
  box-shadow:2px 2px 0 rgba(20,8,42,.7);
  background:linear-gradient(180deg,#fff 0%,#f2f5ff 46%,#d7e2f7 52%,#fff 100%)}
.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 rgba(20,8,42,.75)}
.btn-go{background:linear-gradient(180deg,#fffce8 0%,var(--lime) 34%,#96d400 100%)}
#note{font-size:9.5px;line-height:1.6;color:#4a3a63;margin:0}
#note code{background:#efe6ff;border:1px solid #cbb8f0;border-radius:3px;padding:0 3px;font-size:9px}
#src{font-size:9.5px;line-height:1.5;color:#4a3a63;margin:0}
#src b{font-family:'Arial Black',Arial,sans-serif;font-size:10px;color:var(--ink);display:block}

/* ── list view ───────────────────────────────────────────────────────── */
#listwrap{display:none;position:absolute;inset:0;overflow-y:auto;background:#241046;padding:14px;z-index:500}
.card{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:10px 12px;margin-bottom:9px;
  box-shadow:3px 3px 0 rgba(0,0,0,.5)}
.card h3{margin:0 0 3px;font-family:'Arial Black',Arial,sans-serif;font-size:13px}
.card .a{font-size:10.5px;color:#5b4a72;margin:0 0 5px}
.card .b{font-size:11px;line-height:1.5;margin:0}
#viewseg{position:absolute;top:12px;right:12px;z-index:600;display:flex;gap:4px}
#viewseg button{border:2.5px solid var(--ink);border-radius:8px;padding:7px 13px;cursor:pointer;
  font:700 11px Verdana,sans-serif;box-shadow:2px 2px 0 rgba(0,0,0,.6);
  background:linear-gradient(180deg,#fff 0%,#eef3ff 48%,#d5e0f5 52%,#fff 100%)}
#viewseg button.on{background:linear-gradient(180deg,#fff0fa 0%,var(--pink) 34%,#d4197c 100%);color:#fff}

/* ── banner for load failures ────────────────────────────────────────── */
#warn{display:none;position:absolute;left:12px;right:120px;top:12px;z-index:600;background:var(--yellow);
  border:3px solid var(--ink);border-radius:11px;padding:9px 12px;font-size:10.5px;font-weight:700;
  line-height:1.5;box-shadow:3px 3px 0 rgba(0,0,0,.55)}

/* ── popups ──────────────────────────────────────────────────────────── */
.leaflet-popup-content-wrapper{border-radius:13px;border:3px solid var(--ink);box-shadow:4px 4px 0 rgba(0,0,0,.6);background:#fff}
.leaflet-popup-content{margin:12px 13px;font-family:Verdana,sans-serif;width:238px!important}
.leaflet-popup-tip{border:3px solid var(--ink)}
.pop h3{margin:0 0 5px;font-family:'Arial Black',Arial,sans-serif;font-size:14px;line-height:1.2}
.pop .kind{display:inline-block;font:700 9px Verdana,sans-serif;letter-spacing:.03em;text-transform:uppercase;
  border:2px solid var(--ink);padding:2px 7px;border-radius:11px;margin-bottom:7px}
.pop .addr{font-size:10.5px;color:#5b4a72;margin:0 0 6px;line-height:1.45}
.pop .blurb{font-size:11px;line-height:1.55;margin:0 0 8px}
.pop dl{margin:0 0 8px;display:grid;grid-template-columns:auto 1fr;gap:3px 8px;font-size:10px}
.pop dt{color:#5b4a72;font-weight:700}
.pop dd{margin:0}
.pop .tags{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:8px}
.pop .tags span{font-size:9px;font-weight:700;background:#F0E6FF;border:1.5px solid #C6AEF0;color:#4a3a63;padding:2px 6px;border-radius:9px}
.pop .links{display:flex;gap:5px}
.pop .links a{flex:1;text-align:center;font:700 10px Verdana,sans-serif;padding:7px 3px;border-radius:14px;
  text-decoration:none;border:2px solid var(--ink);color:var(--ink);box-shadow:1.5px 1.5px 0 rgba(20,8,42,.6)}
.pop .links a.go{background:linear-gradient(180deg,#fff0fa 0%,var(--pink) 34%,#d4197c 100%);color:#fff}
.pop .links a.web{background:linear-gradient(180deg,#fff 0%,#eef3ff 48%,#d5e0f5 52%,#fff 100%)}
.pop .unv{font-size:9.5px;font-weight:700;background:var(--yellow);border:2px solid var(--ink);border-radius:8px;
  padding:6px 8px;margin-top:8px;line-height:1.5}
.pop .unv a{color:var(--ink)}

/* ── mobile: stack, don't overlay ────────────────────────────────────── */
@media (max-width:860px){
  body{overflow:auto}
  #app{grid-template-columns:1fr;grid-template-rows:58vh auto;height:auto;min-height:100%}
  #mapwrap{grid-row:1;height:58vh}
  #side{grid-row:2;border-right:0;border-top:3px solid var(--ink);overflow-y:visible;padding-bottom:30px}
  .leaflet-popup-content{width:200px!important}
  #warn{right:12px;top:56px}
}
</style></head><body>

    <div id="warn"></div>
  </div>
</div>

/* ── CSV parsing (quoted fields, embedded newlines) ───────────────────── */
function parseCSV(text){
  var rows=[],row=[],cell='',q=false,i=0;
  text=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for(;i<text.length;i++){
    var c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"'){ q=true; }
    else if(c===','){ row.push(cell); cell=''; }
    else if(c==='\n'){ row.push(cell); cell=''; rows.push(row); row=[]; }
    else cell+=c;
  }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  if(!rows.length) return [];
  var head=rows.shift().map(function(h){return h.trim().toLowerCase();});
  return rows.filter(function(r){return r.join('').trim()!=='';}).map(function(r){
    var o={}; head.forEach(function(h,n){o[h]=(r[n]||'').trim();}); return o;
  });
}
function splitList(s){ return (s||'').split('|').map(function(x){return x.trim();}).filter(Boolean); }
function normalise(r){
  var lat=parseFloat(r.lat), lng=parseFloat(r.lng);
  return {
    name:r.name, address:r.address||'', neighborhood:r.neighborhood||'',
    lat:isFinite(lat)?lat:null, lng:isFinite(lng)?lng:null,
    type:TYPES[r.type]?r.type:'Vintage boutique',
    price:Math.min(3,Math.max(1,parseInt(r.price,10)||2)),
    goods:splitList(r.goods), eras:splitList(r.eras),
    nonprofit:/^(y|yes|true|1)$/i.test(r.nonprofit||''),
    buysell:splitList(r.buysell), hours:r.hours||'', link:r.link||'',
    blurb:r.blurb||'', verified:/^(y|yes|true|1)$/i.test(r.verified||''), notes:r.notes||''
  };
}

/* ── loading: Google Sheet → shops.csv → built-in copy ────────────────── */
function sheetCsvUrl(u){
  if(!u) return null;
  if(/output=csv/.test(u)) return u;
  var m=u.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  var id=m?m[1]:(/^[a-zA-Z0-9-_]{20,}$/.test(u.trim())?u.trim():null);
  return id?('https://docs.google.com/spreadsheets/d/'+id+'/gviz/tq?tqx=out:csv&sheet=Shops'):null;
}
function ok(r){ if(!r.ok) throw new Error(r.status); return r.text(); }
function load(){
  var url=sheetCsvUrl(SHEET_URL);
  var chain = url ? fetch(url).then(ok).then(function(t){return {rows:parseCSV(t),src:'sheet'};})
                  : Promise.reject(new Error('no sheet'));
  chain.catch(function(){ return fetch('shops.csv').then(ok).then(function(t){return {rows:parseCSV(t),src:'file'};}); })
       .catch(function(){ return {rows:SEED, src:'seed'}; })
       .then(function(res){
          SHOPS = res.rows.map(normalise).filter(function(s){return s.name;});
          var note = res.src==='sheet' ? '<b>live from your google sheet</b>edits show up on reload.'
                   : res.src==='file'  ? '<b>shops.csv</b>'+(SHEET_URL?'google sheet unreachable — using the file in this repo.':'connect a google sheet to edit without code.')
                   : '<b>built-in list</b>running straight from the page — nothing external needed.';
          var missing = SHOPS.filter(function(s){return s.lat===null;}).length;
          if(missing) note += ' '+missing+' row(s) have no coordinates and are hidden.';
          document.getElementById('src').innerHTML = note;
          apply();
       })
       .catch(function(e){ warn('⚠ could not load any shop data: '+e.message); });
}

/* ── filters ─────────────────────────────────────────────────────────── */
function chip(host,label,key,colour){
  var b=document.createElement('button');
  b.className='chip'; b.type='button'; b.dataset.v=label;
  b.innerHTML=(colour?'<i style="background:'+colour+'"></i>':'')+label.toLowerCase();
  b.onclick=function(){ state[key][label]=!state[key][label]; b.classList.toggle('on'); apply(); };
  host.appendChild(b);
}
function buildFilters(){
  var t=document.getElementById('fType'); t.innerHTML='';
  Object.keys(TYPES).forEach(function(k){ chip(t,k,'types',TYPES[k]); });
  var g=document.getElementById('fGoods'); g.innerHTML='';
  GOODS.forEach(function(k){ chip(g,k,'goods',null); });
  var e=document.getElementById('fEra'); e.innerHTML='';
  ERAS.forEach(function(k){ chip(e,k,'eras',null); });

  document.querySelectorAll('#fPrice button').forEach(function(b){
    b.onclick=function(){
      document.querySelectorAll('#fPrice button').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on'); state.price=+b.dataset.p; apply();
    };
  });
  document.getElementById('fNonprofit').onchange=function(){ state.nonprofit=this.checked; apply(); };
  document.getElementById('fBuys').onchange=function(){ state.buys=this.checked; apply(); };
  document.getElementById('search').oninput=function(){ state.q=this.value.toLowerCase(); apply(); };

  var r=document.getElementById('fRoutes'); r.innerHTML='';
  ROUTES.forEach(function(rt,i){
    var b=document.createElement('button');
    b.className='routebtn'; b.type='button'; b.dataset.i=i;
    b.innerHTML='<span class="dot" style="background:'+rt.color+'"></span>'+
                '<span><b>'+rt.name.toLowerCase()+'</b><small>'+rt.stops.length+' stops</small></span>';
    b.onclick=function(){ selectRoute(activeRoute===i?null:i); };
    r.appendChild(b);
  });
}
function any(o){ for(var k in o) if(o[k]) return true; return false; }
function hits(sel,list){ if(!any(sel)) return true; for(var k in sel) if(sel[k]&&list.indexOf(k)>-1) return true; return false; }
function visible(s){
  if(s.lat===null) return false;
  if(state.q){
    var hay=(s.name+' '+s.address+' '+s.blurb+' '+s.goods.join(' ')+' '+s.type).toLowerCase();
    if(hay.indexOf(state.q)<0) return false;
  }
  if(any(state.types) && !state.types[s.type]) return false;
  if(!hits(state.goods,s.goods)) return false;
  if(!hits(state.eras,s.eras)) return false;
  if(state.price && s.price!==state.price) return false;
  if(state.nonprofit && !s.nonprofit) return false;
  if(state.buys && !s.buysell.some(function(b){return /buys|consign|trade/i.test(b);})) return false;
  if(activeRoute!==null && ROUTES[activeRoute].stops.indexOf(s.name)<0) return false;
  return true;
}

/* ── rendering ───────────────────────────────────────────────────────── */
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function darkText(c){ return c==='#FFE23D'||c==='#C6FF3D'; }
function dot(s,n){
  var c=TYPES[s.type];
  return L.divIcon({className:'',iconSize:[n?26:17,n?26:17],iconAnchor:[n?13:8.5,n?13:8.5],
    html:'<div style="width:100%;height:100%;border-radius:50%;background:'+c+';border:2.5px solid #fff;'+
         'box-shadow:0 0 0 2px #14082A, 0 0 11px '+c+';display:flex;align-items:center;justify-content:center;'+
         'color:'+(darkText(c)?'#14082A':'#fff')+';font:700 11px Verdana,sans-serif">'+(n?n:'')+'</div>'});
}
function popup(s){
  var c=TYPES[s.type];
  var maps='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.name+', '+s.address+', New York, NY');
  var h='<div class="pop"><h3>'+esc(s.name)+'</h3>'+
    '<span class="kind" style="background:'+c+';color:'+(darkText(c)?'#14082A':'#fff')+'">'+esc(s.type)+' · '+'$'.repeat(s.price)+'</span>'+
    '<p class="addr">'+esc(s.address)+(s.neighborhood?' · '+esc(s.neighborhood):'')+'</p>';
  if(s.blurb) h+='<p class="blurb">'+esc(s.blurb)+'</p>';
  h+='<dl>';
  if(s.hours) h+='<dt>hours</dt><dd>'+esc(s.hours)+'</dd>';
  if(s.buysell.length) h+='<dt>takes stuff</dt><dd>'+esc(s.buysell.join(', '))+'</dd>';
  if(s.nonprofit) h+='<dt>mission</dt><dd>nonprofit / mission-driven</dd>';
  h+='</dl>';
  if(s.eras.length||s.goods.length)
    h+='<div class="tags">'+s.goods.concat(s.eras).map(function(t){return '<span>'+esc(t)+'</span>';}).join('')+'</div>';
  h+='<div class="links"><a class="go" href="'+maps+'" target="_blank" rel="noopener">directions ↗</a>'+
     (s.link?'<a class="web" href="'+esc(s.link)+'" target="_blank" rel="noopener">website ↗</a>':'')+'</div>';
  if(!s.verified)
    h+='<div class="unv">⚠ not verified yet — hours, and whether it is still open, need confirming.'+
       (FORM_URL?' <a href="'+FORM_URL+'" target="_blank" rel="noopener">tell us what you found ↗</a>':'')+'</div>';
  return h+'</div>';
}
function card(s,n){
  var c=TYPES[s.type];
  return '<div class="card"><h3>'+(n?n+'. ':'')+esc(s.name)+'</h3>'+
    '<p class="a"><span class="kind" style="display:inline-block;background:'+c+';color:'+(darkText(c)?'#14082A':'#fff')+
    ';border:2px solid #14082A;border-radius:11px;padding:1px 7px;font:700 9px Verdana;text-transform:uppercase">'+
    esc(s.type)+' · '+'$'.repeat(s.price)+'</span><br/>'+esc(s.address)+'</p>'+
    (s.blurb?'<p class="b">'+esc(s.blurb)+'</p>':'')+'</div>';
}

function apply(){
  var list = SHOPS.filter(visible);
  if(activeRoute!==null){
    var order=ROUTES[activeRoute].stops;
    list.sort(function(a,b){ return order.indexOf(a.name)-order.indexOf(b.name); });
  }
  if(HAS_MAP && map){
    markers.forEach(function(m){ map.removeLayer(m); }); markers=[];
    list.forEach(function(s,i){
      var m=L.marker([s.lat,s.lng],{icon:dot(s,activeRoute!==null?i+1:0),draggable:ADMIN})
            .bindPopup(popup(s),{maxWidth:280});
      if(ADMIN) m.on('dragend',function(e){ var p=e.target.getLatLng(); s.lat=+p.lat.toFixed(5); s.lng=+p.lng.toFixed(5); adminOut(); });
      m.addTo(map); markers.push(m);
    });
    drawRoute(list);
  }
  document.getElementById('listwrap').innerHTML =
    list.length ? list.map(function(s,i){ return card(s,activeRoute!==null?i+1:0); }).join('')
                : '<div class="card"><h3>nothing matches</h3><p class="b">Try clearing a filter or two.</p></div>';
  routeCard(list);

  var tot=SHOPS.filter(function(s){return s.lat!==null;}).length;
  var unv=SHOPS.filter(function(s){return !s.verified;}).length;
  document.getElementById('count').innerHTML='<b>'+list.length+'</b> of '+tot+' shops shown'+
    (unv?'<br/>'+unv+' still need verifying':'');
}

function drawRoute(list){
  if(!routeLayers) return;
  routeLayers.clearLayers();
  if(activeRoute===null) return;
  var pts=list.map(function(s){return [s.lat,s.lng];});
  if(pts.length>1){
    L.polyline(pts,{color:'#14082A',weight:6,opacity:.9}).addTo(routeLayers);
    L.polyline(pts,{color:ROUTES[activeRoute].color,weight:3,opacity:1,dashArray:'8 6'}).addTo(routeLayers);
  }
  if(pts.length) map.fitBounds(L.latLngBounds(pts).pad(.2));
}
function routeCard(list){
  var rc=document.getElementById('rc');
  if(activeRoute===null){ rc.style.display='none'; return; }
  var rt=ROUTES[activeRoute];
  document.getElementById('rcName').textContent=rt.name;
  document.getElementById('rcDesc').textContent=rt.desc;
  var ol=document.getElementById('rcList'); ol.innerHTML='';
  list.forEach(function(s,i){
    var li=document.createElement('li'); li.textContent=s.name;
    li.onclick=function(){
      if(HAS_MAP&&map){ setView('map'); map.setView([s.lat,s.lng],17); if(markers[i]) markers[i].openPopup(); }
    };
    ol.appendChild(li);
  });
  rc.style.display='block';
}
function selectRoute(i){
  activeRoute=i;
  document.querySelectorAll('.routebtn').forEach(function(b){ b.classList.toggle('on',+b.dataset.i===i); });
  apply();
  if(i===null && HAS_MAP && map) map.setView([40.7235,-73.9875],14);
}

/* ── map / list toggle ───────────────────────────────────────────────── */
function setView(v){
  view=v;
  document.getElementById('listwrap').style.display = v==='list'?'block':'none';
  document.getElementById('vMap').classList.toggle('on',v==='map');
  document.getElementById('vList').classList.toggle('on',v==='list');
  if(v==='map' && map) map.invalidateSize();
}

/* ── admin pin-fixing ────────────────────────────────────────────────── */
function adminOut(){
  var box=document.getElementById('adminBox'); if(!box) return;
  box.value='name,lat,lng\n'+SHOPS.filter(function(s){return s.lat!==null;})
    .map(function(s){ return '"'+s.name.replace(/"/g,'""')+'",'+s.lat+','+s.lng; }).join('\n');
}
function buildAdmin(){
  var d=document.createElement('div');
  d.className='blk';
  d.innerHTML='<p class="lbl"><b>✦</b> pin-fixing mode</p>'+
    '<p style="font-size:9.5px;line-height:1.55;margin:0 0 7px;color:#4a3a63">Drag any pin to its real doorway, then paste these columns back into the sheet.</p>'+
    '<textarea id="adminBox" style="width:100%;height:100px;font:400 9px ui-monospace,monospace;border:2px solid #14082A;border-radius:8px;padding:6px"></textarea>'+
    '<button class="btn" id="adminCopy">copy all coordinates</button>';
  document.getElementById('side').appendChild(d);
  document.getElementById('adminCopy').onclick=function(){
    var t=document.getElementById('adminBox'); t.select();
    try{ document.execCommand('copy'); }catch(e){}
    var b=this; b.textContent='copied ✓'; setTimeout(function(){b.textContent='copy all coordinates';},1600);
  };
  adminOut();
}

/* ── boot: filters first, so the UI exists even if the map can't ─────── */
buildFilters();
document.getElementById('resetBtn').onclick=function(){
  state={q:'',types:{},goods:{},eras:{},price:0,nonprofit:false,buys:false};
  document.getElementById('search').value='';
  document.getElementById('fNonprofit').checked=false;
  document.getElementById('fBuys').checked=false;
  document.querySelectorAll('.chip').forEach(function(c){c.classList.remove('on');});
  document.querySelectorAll('#fPrice button').forEach(function(b,i){b.classList.toggle('on',i===0);});
  selectRoute(null);
};
document.getElementById('vMap').onclick=function(){ setView('map'); };
document.getElementById('vList').onclick=function(){ setView('list'); };

var add=document.getElementById('addBtn');
if(FORM_URL){ add.href=FORM_URL; } else { add.style.display='none'; }
document.getElementById('note').innerHTML =
  'A starter list, not a finished one — every entry still needs someone to walk past and confirm it. '+
  'Shops here open and close fast. Pin positions are block-accurate until verified; '+
  'add <code>?admin=1</code> to the address bar to drag them into place.';

if(HAS_MAP){
  try{
    map = L.map('map',{zoomControl:false}).setView([40.7235,-73.9875],14);
    L.control.zoom({position:'bottomright'}).addTo(map);
    var tiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
      {attribution:'&copy; OpenStreetMap &copy; CARTO',subdomains:'abcd',maxZoom:19});
    var tileFails=0;
    tiles.on('tileerror',function(){
      if(++tileFails===6) warn('⚠ basemap tiles are blocked here, so the background is empty — pins, filters and routes all still work. It looks normal on a live web server.');
    });
    tiles.addTo(map);
    routeLayers = L.layerGroup().addTo(map);
    if(ADMIN) buildAdmin();
  }catch(e){
    HAS_MAP=false; warn('⚠ the map could not start ('+e.message+') — showing the list instead.');
  }
}else{
  warn('⚠ leaflet.js did not load, so there is no map — showing the list instead. Check that the <b>vendor</b> folder sits next to this file.');
}
if(!HAS_MAP){ setView('list'); document.getElementById('viewseg').style.display='none'; }

load();
</script>
</body></html>
